[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdl"
version = "0.1.0"
description = "Re-derivation Leakage: measuring memory-mediated recovery of unlearned knowledge in multi-agent systems"
readme = "README.md"
license = { text = "MIT" }
# NOTE: open-unlearning targets Python 3.11. That constraint binds the *submodule's*
# environment (Colab / the GPU box), not this pure-Python core. `rdl` itself must be
# installable on whatever the developer's laptop ships so the CPU gate can actually run.
# See docs/04_decisions.md ADR-0002.
requires-python = ">=3.10,<3.14"
dependencies = [
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "huggingface_hub>=0.23",
    "rich>=13.0",
    "orjson>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
# torch is installed separately from the appropriate index (CPU vs cu121 wheel);
# pinning it here would fight requirements-*.txt.
cpu = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Declared explicitly even though omegaconf pulls it in: tests/unit/test_checkpoint_ids.py
    # and tests/unit/test_prompt_style.py read the YAML configs directly, and relying on a
    # transitive dependency for that breaks the day omegaconf changes its parser.
    "PyYAML>=6.0",
    # Leak-k's released gate uses this implementation with Porter stemming.
    "rouge-score==0.1.2",
]
semantic = [
    # CPU-only public TOFU reference loader used by `rdl rescore-day2`.
    "datasets>=2.19",
]
gpu = [
    "accelerate==0.34.2",
    "bitsandbytes==0.43.3",
    "faiss-cpu==1.8.0.post1",
    "sentence-transformers==3.1.1",
    "transformers==4.51.3",
    "datasets==3.0.1",
]
# The graph study's fast GPU backend. Separate extra, not part of `gpu`: vLLM pins its
# own torch, and installing it alongside the reproduction environment would replace the
# torch every existing number was produced under. See requirements-gpu-ampere.txt.
vllm = [
    "vllm==0.6.3.post1",
]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[project.scripts]
rdl = "rdl.cli.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdl = ["py.typed"]

# --------------------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------------------

# `third_party/` is a pinned submodule we must never patch (design invariant 1,
# ADR-0001). mypy and pre-commit already excluded it; ruff and black did not, so a bare
# `ruff check .` or `black --check .` reported 268 errors and 45 files to reformat in
# vendored code — and the only correct response to every one of them is "do not touch
# that". Excluded here so the bare command is usable.
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "^/third_party/"
force-exclude = "^/third_party/"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is black's job
    "B008",   # typer uses function calls in argument defaults by design
    "RUF012", # mutable class attrs on pydantic models are fine
]
# Set-theory notation in the graph-study docstrings is CONTENT, not a typo. The
# Forget-ID propagation rule is written as `S(x) = D(x) ∪ ⋃ S(p)` in the protocol and in
# the code that implements it; spelling it "U" would make the two disagree.
allowed-confusables = ["∪", "⋃", "−", "≤", "≥"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# NO `python_version` pin, deliberately. Pinning it BELOW the running interpreter makes
# mypy parse third-party stubs under the older grammar: numpy 2.x's .pyi uses 3.12's
# `type` statement, which a python_version=3.10 run rejects outright with
# "Type statement is only supported in Python 3.12 and greater". Letting mypy follow the
# interpreter also means the CI matrix genuinely type-checks each supported version
# rather than checking 3.10 three times.
files = ["src/rdl"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "third_party/"

[[tool.mypy.overrides]]
module = ["faiss.*", "torch.*", "transformers.*", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires network access (excluded from the CPU gate)",
    "gpu: test requires a CUDA device",
    "slow: test takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]
