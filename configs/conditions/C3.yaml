# C3 — THE CONDITION THAT DECIDES THE PAPER.
#
# Both agents unlearned on the SAME forget set. SBU's id blocklist enforced. Write-back
# on the framework default.
#
# Pre-registered gate (docs/00_preregistration.md):
#   SysRecall@5(C3, persistent store) - SysRecall@5(C1) >= 20 absolute points, AND
#   laundering_rate(C3) >= 0.5, over 5 seeds, with non-overlapping 95% CIs.
#
# Confound gate: the result MUST survive under always_delegate. If it appears only under
# abstention routing, we measured agent A's utility collapse (0.60 -> 0.46), not
# forgetting. run_condition.py runs that control arm automatically.
#
# Kill criterion, day 5: C3 - C1 < 10 points -> the finding is "heterogeneous unlearning
# leaks", which is a configuration bug rather than a mechanism. Re-scope that week.
condition: C3
description: "THE test: both agents unlearned on the same forget set, framework-default write-back."

env: colab_t4
memory: sbu_id_blocklist
writepolicy: framework_default

agent_a: A_unlearned
agent_b: B_unlearned_same

models:
  - tofu_llama32_1b_npo_forget10

seed: 42
seeds: [0, 1, 2, 3, 4]

episode:
  max_turns: 5
  retrieval_k: 5
  greedy: true
  max_new_tokens: 128

data:
  dataset: tofu
  forget_split: forget10
  retain_split: retain90
  n_items: null
