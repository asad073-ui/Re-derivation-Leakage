# C3 — REDUNDANCY CONTROL. **No longer the condition that decides the paper.**
#
# Agent B is agent A's checkpoint loaded a second time. Same weights, same greedy
# decoder, same question, same retrieval context — so B's answer IS A's answer. That
# makes C3 a measurement of one model queried twice.
#
# It earns its place as a control, and only as a control: C3 - C1W says how much of any
# apparent multi-agent effect is explained by asking the same model twice and writing
# both answers. If C3D - C1W is no larger than C3 - C1W, there is no multi-agent
# finding, and this arm is what proves it.
#
# The treatment moved to:
#   C3D   two INDEPENDENTLY unlearned agents (ensemble)
#   C3C   the same two, with A's answer handed to B (compositional)
# and the baseline moved from C1 to C1W. See ADR-0017/0018 and
# docs/00b_preregistration_v2.md for why, and docs/00_preregistration.md (FROZEN) for
# what was originally registered.
#
# Confound gate still applies: any reported result MUST survive under always_delegate.
# If it appears only under abstention routing, we measured agent A's utility collapse
# (0.60 -> 0.46), not forgetting. run_condition.py runs that control arm automatically.
condition: C3
description: "Redundancy control: ONE unlearned checkpoint in both agent slots, framework-default write-back."

env: vast_rtx3090
memory: sbu_id_blocklist
writepolicy: framework_default

agent_a: A_unlearned
agent_b: B_unlearned_same

models:
  - tofu_llama32_1b_npo_forget10

seed: 42
seeds: [0, 1, 2, 3, 4]

episode:
  max_turns: 5
  retrieval_k: 5
  greedy: true
  max_new_tokens: 128
  prompt_style: openunlearning

data:
  dataset: tofu
  forget_split: forget10
  retain_split: retain90
  n_items: null
