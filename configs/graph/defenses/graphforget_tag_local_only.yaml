# TAG-LOCAL-ONLY. Enforce a Forget-ID where you FIND one; never spread it.
#
# This is `graphforget_taint_only` with forward propagation removed and nothing else
# changed: same detector state (off), same accumulation (off), same five guarded
# surfaces, same policy. A tagged source — the seeded re-entry note, a node tagged in an
# earlier episode — is withheld or blocked exactly as the taint arm would withhold it.
# What this arm does NOT do is attach that scope to what it produces, so a derivative of
# a tagged note is untagged and travels freely.
#
# WHY IT EXISTS (GU-0033). `taint_only - unguarded` was being read as the contribution of
# taint PROPAGATION, but it confounds two things: enforcing tags that already exist, and
# forwarding them to descendants. A system that only ever had to block the tagged source
# node needs no propagation at all. Splitting the arm splits the claim:
#
#   tag_local_only vs unguarded    what enforcing existing tags buys on its own
#   taint_only vs tag_local_only   what FORWARDING buys on top of that — the actual
#                                  propagation claim, and the only contrast that can
#                                  support it
#
# Detection stays off, as in `taint_only`, so the pair differs in one variable. Pricing
# propagation against an arm that also gained a detector would confound them again.
name: graphforget_tag_local_only
kind: graphforget
semantic_detection: false
consume_forget_ids: true
propagate_forget_ids: false
accumulate_evidence: false
guard_edges: true
guard_writes: true
guard_retrievals: true
guard_final_output: true
allow_safe_refusal: true
# Nothing to rescan with: the detector is off, exactly as in taint_only.
rescan_untagged_memory: false
description: "enforce Forget-IDs where they are already carried; never forward them"
