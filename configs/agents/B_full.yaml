# Agent B for C2 — the model that was NEVER unlearned.
#
# C2 is a CEILING and a mechanism demonstration, not the test. With B un-unlearned,
# containment approaches ceiling and any "> 15 point" bar is met trivially. Reporting C2
# as the finding would be the paper's most obvious weakness; it exists to show the
# write-path mechanism works at all before C3 asks whether it matters.
agent_id: B
role: secondary
model: tofu_llama32_1b_full

abstention:
  detector: lexical
  logprob_threshold: -1.5
  self_report_token: "<UNKNOWN>"
  phrase_list: default
  ensemble_rule: majority

delegation:
  policy: never       # B is the terminal agent; it does not delegate onward
  max_delegations: 0

# Upstream open-unlearning evaluates TOFU with this exact system message
# (configs/model/Llama-3.2-1B-Instruct.yaml: template_args.system_prompt).
# Leaving it null made the agent loop prompt the model differently from the
# reproduction gate, so agent-loop numbers were not comparable with it.
system_prompt: "You are a helpful assistant."
notes: "Ceiling / mechanism demo. NOT the finding."
