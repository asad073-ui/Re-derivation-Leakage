# SEMANTIC-ONLY. Everything GraphForget does EXCEPT Forget-ID inheritance.
#
# Multi-surface enforcement, subset/evidence accumulation, retrieval rescan — all present.
# Scopes are never inherited from a parent, so a paraphrase that scores below threshold
# passes even when the message it was derived from was tagged.
#
# `full - semantic_only` is therefore exactly the contribution of provenance inheritance,
# with the detector, the policy, the surfaces and the threshold all held constant.
name: graphforget_semantic_only
kind: graphforget
semantic_detection: true
propagate_forget_ids: false
accumulate_evidence: true
guard_edges: true
guard_writes: true
guard_retrievals: true
guard_final_output: true
allow_safe_refusal: true
rescan_untagged_memory: true
description: "GraphForget minus Forget-ID inheritance: detection and accumulation only"
