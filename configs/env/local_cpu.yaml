# Laptop. No GPU, no network, no HF token.
# This is the environment `make cpu-all` runs in and the one every contract test uses.
name: local_cpu
device: cpu
dtype: float32          # fp16 on CPU is slower than fp32 and unsupported by many kernels
attn_implementation: eager
batch_size: 1
max_new_tokens: 64
allow_fp16_training: false
index_backend: numpy    # exact, zero deps
notes: >
  Everything except the actual forward pass must be testable here. If a module cannot
  run in this env with StubLM, it is coupled wrong.
