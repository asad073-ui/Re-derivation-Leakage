# Runnable single-model direct Leak@k profile for the released RULE-NPO checkpoint.
condition: C0
description: "Released RULE-NPO direct Leak@k baseline."
env: vast_rtx3090
memory: none
writepolicy: disabled
agent_a: RULE_alone
models:
  - tofu_forget10_rule_npo
episode:
  max_new_tokens: 200
  prompt_style: openunlearning
sampling:
  enabled: true
  protocol: leakk_official
  n_samples: 200
  k_values: [1, 2, 4, 8, 16, 32, 64, 128]
  primary_k: 32
  temperature: 1.0
  top_p: 1.0
  top_k: null
  base_seed: 1729
data:
  dataset: tofu
  forget_split: forget10
  retain_split: retain90
