name: ci-cpu

# The CPU gate. No GPU, no HF token, no model downloads.
# tests/integration is deliberately excluded: it downloads a tiny model and therefore
# needs network. It runs locally via `make test-integration`.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The endpoints of `requires-python`, not two versions from the middle of it.
        # Two jobs either way -- but 3.11 and 3.12 are the two interpreters least likely
        # to find anything, because version bugs cluster at the boundaries, where the
        # stdlib gains and loses things. 3.10 is both the declared floor and the machine
        # ADR-0002 exists to keep the gate runnable on; testing everything except it is
        # how a bare `tomllib` import survived in tests/unit. See ADR-0063.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT check out the open-unlearning submodule: it is large, it is not
          # needed for the CPU gate, and pulling it here would make CI a network test.
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install rdl
        run: pip install -e ".[cpu,dev]"

      # A .gitignore rule once swallowed the whole configs/env/ group: `env/` is
      # unanchored and matches a directory named `env` at any depth. Local tests passed
      # because the files were on disk; only a clean clone could see they were never
      # committed. This step makes that failure mode loud and immediate.
      - name: Assert no source or config file is gitignored
        run: |
          missing=$(git ls-files --others --ignored --exclude-standard \
            -- 'configs/**/*.yaml' 'src/**/*.py' 'tests/**/*.py' 'tests/**/*.json')
          if [ -n "$missing" ]; then
            echo "::error::these tracked-by-intent files are being ignored by .gitignore:"
            echo "$missing"
            exit 1
          fi
          for group in env models agents memory writepolicy conditions; do
            n=$(git ls-files "configs/$group" | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "::error::configs/$group is empty in git — check .gitignore"
              exit 1
            fi
            echo "configs/$group: $n file(s)"
          done

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m black --check src tests
          python -m mypy

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Contract tests (StubLM)
        run: python -m pytest tests/contract -q

      - name: Assert no secrets in tracked files
        run: |
          if git grep -nE '(hf_[A-Za-z0-9]{34}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36})' -- . ':!*.example' ':!.github/*'; then
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credential patterns found"

  network-transformers-contract:
    # This intentionally exercises the public Hub model path that the CPU gate avoids.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install loader contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cpu,dev]"
          # This job is specifically the real Transformers contract.  Keep the
          # dependency explicit: the offline CPU extra intentionally omits it.
          pip install transformers==4.51.3
          # DeBERTa-v3 tokenizers are SentencePiece, and transformers pulls in neither
          # package needed to load one: sentencepiece reads the model and protobuf parses
          # its proto. Installed here, in the job that actually loads them, for the same
          # reason the GPU requirements declare them — the alternative is finding out on a
          # rented box. This job caught the missing protobuf; that is what it is for.
          pip install sentencepiece==0.2.0 protobuf==4.25.8
          # Mistral-Small-3.2 publishes tekken.json and no tokenizer.json, and transformers
          # has no Mistral3Config entry in its tokenizer mapping, so AutoTokenizer raises
          # KeyError on judge B. Same reasoning as the two lines above: the judge loader is
          # exercised in the job that can actually load a tokenizer.
          pip install "mistral-common>=1.6.2"
      - name: Assert Transformers is installed
        run: python -c "import transformers; print(transformers.__version__)"
      - name: Real sampled Transformers generation
        run: python -m pytest tests/integration/test_sampled_hf_generation.py -q -rs
      - name: The detector's two pinned DeBERTa tokenizers load
        run: python -m pytest tests/integration/test_deberta_tokenizers.py -q -rs
      - name: Both local judges resolve and encode through the right tokenizer family
        run: python -m pytest tests/integration/test_detector_v4_3_judge_tokenizers.py -q -rs
