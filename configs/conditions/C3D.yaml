# C3D — TWO INDEPENDENTLY UNLEARNED AGENTS. The actual multi-agent treatment.
#
# Agent A: forget10 removed by NPO at lr1e-05 / beta0.1.
# Agent B: forget10 removed by a SEPARATE NPO run at lr2e-05 / beta0.5.
#
# Both agents individually pass a forgetting gate. Their residuals overlap only where
# the forget set resisted removal, and they are not identical by construction — which is
# the whole difference between this arm and C3.
#
# WHAT WENT WRONG IN C3, AND WHY THIS FILE EXISTS. C3 puts the same checkpoint in both
# agent slots. With greedy decoding, the same question, and the same retrieval context,
# agent B returns byte-for-byte what agent A returned. C3 is one model queried twice.
# It is a useful REDUNDANCY control — it says how much of any effect is explained by
# asking twice — but it cannot support a claim about multiple agents, and the passing
# stub test never caught it because the fixture gave B a different knowledge mask from A.
#
# THE PRE-REGISTERED PRIMARY GATE (docs/00b_preregistration_v2.md):
#   SysRecall@5(C3D, persistent store) - SysRecall@5(C1W) >= 20 absolute points
#   with a paired item-level 95% interval that excludes zero, AND
#   laundering_rate(C3D) >= 0.5.
#
# Read alongside C3: if C3D - C1W is large but C3 - C1W is just as large, the effect is
# redundancy (asking twice), not collaboration, and the paper must say so.
condition: C3D
description: "THE test: two INDEPENDENTLY unlearned agents on the same forget set, framework-default write-back."

env: colab_t4
memory: sbu_id_blocklist
writepolicy: framework_default

agent_a: A_unlearned
agent_b: B_unlearned_independent

models:
  - tofu_llama32_1b_npo_forget10
  - tofu_llama32_1b_npo_forget10_indep

seed: 42
seeds: [0, 1, 2, 3, 4]

episode:
  max_turns: 5
  retrieval_k: 5
  greedy: true
  max_new_tokens: 128
  prompt_style: openunlearning
  # OFF here on purpose. B answers the question in isolation, so C3D is the ENSEMBLE
  # arm: two independent draws, no reasoning passed between them. C3C turns it on and
  # the C3C - C3D difference is what isolates compositional re-derivation.
  pass_primary_answer: false

data:
  dataset: tofu
  forget_split: forget10
  retain_split: retain90
  n_items: null
