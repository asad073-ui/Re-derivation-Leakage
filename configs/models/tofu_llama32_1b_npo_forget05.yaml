# NPO unlearned on a DISJOINT forget set (forget05), for the B_unlearned_disjoint arm.
#
# Why this file exists: C1/C3 use two agents unlearned on the SAME forget set. The
# disjoint arm asks a different question — does the leak persist when B never saw the
# forget10 unlearning at all? — and needs a checkpoint whose forget set does not overlap.
#
# !! EXISTENCE UNVERIFIED, AND forget05 IS NOT DISJOINT FROM forget10 IN TOFU !!
# TOFU's splits are nested (forget01 subset forget05 subset forget10), so this is an
# APPROXIMATION, not a true disjoint control. Treat any result from this arm as
# suggestive only until a genuinely disjoint checkpoint is trained on Ampere.
# Recorded as an open issue in docs/05_risks.md.
name: tofu_llama32_1b_npo_forget05
kind: hf
