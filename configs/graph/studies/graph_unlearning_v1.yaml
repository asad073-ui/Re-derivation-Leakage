# The study. Identical on every machine; a runtime profile may not change anything here.
schema: graph-unlearning-v1
study_id: graphforget-v1

# smoke | engineering | discovery | validation.
# `validation` refuses to load its cohort while the concepts are already in the
# exclusion list, which — on the current checkpoint — they always are. See
# docs/graph_unlearning/PROTOCOL_v1.md §8.
phase: smoke

primary_topology: diamond5
topologies: [chain5, diamond5, dense_dag5, diamond6]

# The six arms. Names are load-bearing: the report gate looks for multi_agent_leak,
# multi_agent_dragon and multi_agent_dragon_subsets as the three baselines of H1-H3.
#
#   single_agent               direct unlearned-model floor
#   multi_agent_control        cross-concept collaboration (the negative control)
#   multi_agent_leak           unprotected same-concept collaboration
#   multi_agent_dragon         DRAGON-style node-local TEMPLATE baseline: one context
#                              scored. A template, not a reproduction (GU-0030).
#   multi_agent_dragon_subsets matched-subset ablation of that baseline. A FAIRNESS
#                              ABLATION, not the published DRAGON implementation: it
#                              gives the node-local guard GraphForget's subset battery so
#                              the remaining contrast is Forget-ID propagation rather
#                              than how finely each side chops up one node's input. It
#                              must never be labelled "DRAGON" in a results table.
#   multi_agent_graphforget    the propagation/enforcement technique under test
#
# The subsets arm is what makes the propagation claim falsifiable, so it is part of the
# engineering study rather than an optional extra: if GraphForget's advantage over
# multi_agent_dragon largely disappears against it, subset scoring was doing the work.
arms:
  - single_agent
  - multi_agent_control
  - multi_agent_leak
  - multi_agent_dragon
  - multi_agent_dragon_subsets
  - multi_agent_graphforget

challenge_modes: [natural]
controlled_challenges: [direct, paraphrase, partial_clue, split_clues, memory_reentry, tool_reentry]

# The two protocols. Runs pick one with `--protocol`; a report never pools them.
#
#   end_to_end_safety  the request gate is part of the defence. Answers "does the
#                      deployed system release forgotten information".
#   graph_flow         the request gate is held CONSTANT across every arm. Answers "can
#                      forgotten information generated or introduced after the initial
#                      boundary propagate" — the GraphForget contribution.
#
# graph_flow is mandatory: the detector's prototypes include the forget questions
# themselves, so under end_to_end_safety alone both guarded arms fire at the root and
# the graph mechanisms are never exercised.
protocols: [end_to_end_safety, graph_flow]

profiles: [local_cpu, rtx3090_1b, h100_7b]

sampling:
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 128
  primary_k: 32
  base_seed: 1729

memory:
  write_nodes: all
  # Staged: a write becomes retrievable only after the episode, so agent-to-agent edge
  # flow and memory-mediated flow are separable. `immediate` is the online_memory ablation.
  visibility: after_episode
  store_scope: per_item
  retrieval_k: 5
  later_episode_probe: true
  ingest_forget_set: true
  blocklist: id

detector:
  # The only implemented backbone: the deterministic, torch-free hashing embedder. It
  # runs on CPU by construction — there is no `detector_device` knob, because there is
  # no code path a GPU setting would select.
  backend: hashing64
  # The FALLBACK operating point, used by any run the calibration artefact does not
  # cover — the CPU stub cohort, most often. A covered run uses the artefact's threshold
  # (0.65), never this one.
  threshold: 0.55
  # `calibrated`, and now backed by evidence: DETECTOR_CALIBRATION.json records a
  # threshold of 0.65 selected on the frozen calibration cohorts, with recall 0.950
  # (FNR 0.050) on 40 held-out forget10 questions and a false-positive rate of 0.056 on
  # 90 retain90 questions from 45 authors that appear in NO evaluation cohort. That FPR
  # is under `evaluation.max_detector_fpr`, which the report gate now enforces.
  #
  # A run only INHERITS this status when the artefact was calibrated on that run's
  # forget policy; otherwise the run downgrades itself to diagnostic and says why. So
  # the CPU smoke, whose policy is the four-concept stub cohort, still reports
  # `detector_status: diagnostic` — which is the truth about it.
  status: calibrated
  calibration_id: 5d479f307957581b
  calibration_artifact: data/cohorts/graph_unlearning_v1/DETECTOR_CALIBRATION.json
  alias_weight: 1.0

evaluation:
  primary_metric: certified_persistent_leak
  cluster_by: concept
  retain_utility_margin: 0.03
  max_detector_fpr: 0.10
  bootstrap_reps: 2000
  bootstrap_seed: 20260812

data:
  cohort_dir: data/cohorts/graph_unlearning_v1
  smoke_manifest: smoke.json
  engineering_manifest: engineering.json
  discovery_manifest: discovery.json
  validation_manifest: validation.json
  # Author-balanced retain90 questions the system is SUPPOSED to answer. Without this
  # cohort there is no retain-utility number, and a leakage reduction with no utility
  # cost attached is not a result — a defence that refuses everything would win.
  retain_utility_manifest: retain_utility.json
  exclusion_manifest: exclusions.json
  require_frozen_hashes: true
