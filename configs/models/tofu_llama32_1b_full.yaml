# TOFU finetuned target model. CONFIRMED to exist on the Hub.
#
# Published (open-unlearning/docs/repro.md, forget10):
#   model_utility 0.60   forget_truth_ratio 0.48   forget_quality 1.66e-21
#
# Run the Day 1-2 sanity gate against THIS first. It isolates "is my install correct"
# from "does the unlearned checkpoint exist".
name: tofu_llama32_1b_full
kind: hf
repo_id: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

# dtype_override / attn_override are deliberately UNSET. Leaving them unset means
# hardware.py decides, which is what makes the same config work on a T4 and an H100.
# Setting dtype_override: bfloat16 here would hard-fail on a T4 — by design.
dtype_override: null
attn_override: null

trust_remote_code: false
# -Instruct derivative: the prompt format must match what open-unlearning used or the
# numbers will not reproduce.
chat_template_required: true
